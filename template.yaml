AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SuperRH Backend API — Lambda + API Gateway

Parameters:
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: NeonDB connection string
  JwtSecret:
    Type: String
    NoEcho: true
    Description: JWT signing secret
  GroqApiKey:
    Type: String
    NoEcho: true
    Description: Groq API key

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        DATABASE_URL: !Ref DatabaseUrl
        JWT_SECRET: !Ref JwtSecret
        GROQ_API_KEY: !Ref GroqApiKey

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: superrh-api
      Handler: lambda.handler
      CodeUri: backend/dist/
      Events:
        ApiProxy:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiUrl:
    Description: URL da API Gateway — use como EXPO_PUBLIC_API_URL no frontend
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
